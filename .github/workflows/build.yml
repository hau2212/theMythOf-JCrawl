name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Load version metadata from version.properties
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          get_prop() {
            grep -E "^${1}=" version.properties | head -n 1 | cut -d'=' -f2-
          }
          TAG="$(get_prop releaseTag)"
          VER="$(get_prop versionName)"
          JAR="$(get_prop jarName)"
          CHANNEL="$(get_prop channel)"
          TITLE="$(get_prop releaseTitle)"
          if [ -z "$TAG" ] || [ -z "$JAR" ]; then
            echo "ERROR: version.properties is missing releaseTag or jarName." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Loaded release metadata: tag=$TAG version=$VER channel=$CHANNEL jar=$JAR"

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Stage versioned JAR
        run: cp build/libs/theMythOf-JCrawl.jar "build/libs/${{ steps.ver.outputs.jar }}"

      - uses: actions/upload-artifact@v4
        with:
          name: theMythOf-JCrawl-jar
          path: |
            build/libs/theMythOf-JCrawl.jar
            build/libs/${{ steps.ver.outputs.jar }}

      - name: Publish IMMUTABLE release from version.properties (NEVER modifies existing tags or releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.ver.outputs.jar }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          TITLE: ${{ steps.ver.outputs.title }}
        run: |
          set -euo pipefail

          # STRICT IMMUTABLE RELEASE GUARD:
          # Never force-tag, never --clobber, never edit/overwrite any existing tag or release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Release '$TAG' đã tồn tại — chính sách bất biến KHÔNG cho phép ghi đè release cũ. Bỏ qua bước tạo release."
            echo "Để phát hành bản mới, hãy nâng version trong version.properties (VD: 2.2 -> 2.3 hoặc 2.2 -> 3.2 theo VERSIONING.md)."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Git tag '$TAG' đã tồn tại trên remote — KHÔNG ghi đè tag cũ. Bỏ qua bước tạo release."
            exit 0
          fi

          cat <<EOF > /tmp/release_notes.md
          ## theMythOf-JCrawl \`${TAG}\` (${CHANNEL})

          > Phát hành **bất biến (immutable)** từ commit \`${GITHUB_SHA:0:7}\`. Toàn bộ các bản phát hành trước đó (\`V_2.4_beta\`, \`V_2.3_beta\`, \`V_2.2_beta\`, \`V_2.1_beta\`, \`V_2.0_beta\`, \`V_1.0\`, \`v2.0.0\`) được giữ nguyên tuyệt đối, không chỉnh sửa hay ghi đè.
          > Theo quy ước trong \`VERSIONING.md\`: nâng cấp kiến trúc lõi từ nền \`V_2.4_beta\` tăng MAJOR và giữ nhánh phụ \`4\` -> **\`V_3.4_beta\`**.

          ### 4 Trụ cột Kiến trúc Mới trong \`${TAG}\`

          1. **Chế độ \`0. Nguyên bản (ActionMode.NONE)\` & Nhả 100% — Hết cảnh "chọn rồi không nhả được"**:
             - Chế độ mặc định khi mở Extension là **Nguyên bản (Không can thiệp)**: request đi thẳng lên Server (xóa 1 lần trả \`200\`, bấm lại trả \`400/404\` trung thực).
             - Thẻ chiến lược hỗ trợ **bấm lại để Tắt/Nhả**; dọn cờ Proxy nguyên tử khi chuyển chế độ; bổ sung nút **\`Nhả API này về Nguyên bản\`** và **\`Nhả toàn bộ về Nguyên bản (Reset All)\`**.

          2. **Sổ cái Chính sách Hợp nhất (\`ActionPolicyLedger\`) với Kiến trúc CRUD Đầy đủ & Mở rộng**:
             - Gom toàn bộ cấu hình Action (Toàn cục / Nhóm Method / 1..N Nhánh cây / Đường dẫn Exact-Prefix-Wildcard-Template-Regex / API cụ thể) vào một Sổ cái duy nhất có đầy đủ dấu thời gian kiểm toán (**Tạo lúc**, **Sửa lúc**, **Khớp cuối**, **Số lần khớp**, **Nguồn tạo**).
             - **Create**: Form đầy đủ, Quick-create 1-click, Nhân bản (\`Duplicate\`), Bộ mẫu nhanh (\`Presets\`), Import JSON.
             - **Read**: Tìm kiếm & lọc đa chiều, **Bảng Giải thích Chuỗi luật đang tác động** cho API đang chọn (chỉ rõ luật nào thắng / bị ghi đè), thanh tổng quan phạm vi trên Header, Export JSON.
             - **Update**: Công tắc \`BẬT/TẮT\` inline 1-click, sửa trực tiếp, đổi thứ tự ưu tiên \`Lên/Xuống/Lên đầu\`, cập nhật hàng loạt (\`Bulk Toggle\`).
             - **Delete & Recovery**: Xóa đơn/hàng loạt, Nhả theo phạm vi, Reset All, kèm **Thùng rác Hoàn tác (Undo Trash 50 mục)** khôi phục ngay chỉ bằng 1 chạm.

          3. **Bộ Dò & Căn chỉnh Giao thức Action (\`ActionGateAuditLog\` + \`Batch Pre-flight Simulator\`)**:
             - Ghi nhận **mọi request giao thức Action** đi qua Proxy (cả **Đã Chặn** lẫn **Đã Cho Qua**) kèm chính sách thắng và nút căn chỉnh 1 chạm: **\`+ Chặn chờ duyệt\`**, **\`+ Giữ Proxy\`**, **\`+ Cho qua luôn (ALLOW)\`**.
             - **Bộ Dò Hàng Loạt Trước Khi Chạy**: mô phỏng toàn bộ API đã bắt (hoặc 1 Nhánh) qua Sổ cái Chính sách mà không gửi gói tin thật, hiển thị thống kê & cho phép căn chỉnh trực tiếp.

          4. **Trình Sửa & Gửi lại Request Trực tiếp (\`RequestComposerDialog\`) cho bất kỳ API nào**:
             - Cửa sổ nổi modeless (kéo thả & co giãn tự do, ghim nổi, \`Ctrl+Enter\` gửi ngay, \`JetBrains Mono\`, 0% HTML).
             - Chỉnh sửa Raw HTTP request, \`Protocol / Host / Port\`, \`Format JSON\`, tự tính \`Content-Length\`, chọn gửi bằng **Raw vừa sửa / API gốc / 1..N Roles**, chọn chế độ Action riêng cho lần gửi đó (\`Nguyên bản\` / \`Đổi ID sống\` / \`Chạy Producer\`), xem Response trực tiếp + Lịch sử phiên gửi.
             - Đầy đủ CRUD lưu trữ: **Gửi thử (Ad-hoc)**, **Lưu đè vào API này (Update)**, **Lưu thành API mới trong nhánh (Create/Clone)**, **Đẩy sang Burp Repeater**, **Khôi phục gốc**.

          Tải file \`${JAR}\` rồi nạp vào Burp (\`Extensions > Installed > Add > Java\`).
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG ($VER)"
          git push origin "refs/tags/$TAG"

          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "beta" ] || [ "$CHANNEL" = "alpha" ] || [ "$CHANNEL" = "rc" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" "build/libs/${JAR}" \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
