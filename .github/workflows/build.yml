name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Load version metadata from version.properties
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          get_prop() {
            grep -E "^${1}=" version.properties | head -n 1 | cut -d'=' -f2-
          }
          TAG="$(get_prop releaseTag)"
          VER="$(get_prop versionName)"
          JAR="$(get_prop jarName)"
          CHANNEL="$(get_prop channel)"
          TITLE="$(get_prop releaseTitle)"
          if [ -z "$TAG" ] || [ -z "$JAR" ]; then
            echo "ERROR: version.properties is missing releaseTag or jarName." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Loaded release metadata: tag=$TAG version=$VER channel=$CHANNEL jar=$JAR"

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Stage versioned JAR
        run: cp build/libs/theMythOf-JCrawl.jar "build/libs/${{ steps.ver.outputs.jar }}"

      - uses: actions/upload-artifact@v4
        with:
          name: theMythOf-JCrawl-jar
          path: |
            build/libs/theMythOf-JCrawl.jar
            build/libs/${{ steps.ver.outputs.jar }}

      - name: Publish IMMUTABLE release from version.properties (NEVER modifies existing tags or releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.ver.outputs.jar }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          TITLE: ${{ steps.ver.outputs.title }}
        run: |
          set -euo pipefail

          # STRICT IMMUTABLE RELEASE GUARD:
          # Never force-tag, never --clobber, never edit/overwrite any existing tag or release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Release '$TAG' đã tồn tại — chính sách bất biến KHÔNG cho phép ghi đè release cũ. Bỏ qua bước tạo release."
            echo "Để phát hành bản mới, hãy nâng version trong version.properties (VD: 2.2 -> 2.3 hoặc 2.2 -> 3.2 theo VERSIONING.md)."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Git tag '$TAG' đã tồn tại trên remote — KHÔNG ghi đè tag cũ. Bỏ qua bước tạo release."
            exit 0
          fi

          cat <<EOF > /tmp/release_notes.md
          ## theMythOf-JCrawl \`${TAG}\` (${CHANNEL})

          > Phát hành **bất biến (immutable)** từ commit \`${GITHUB_SHA:0:7}\`. Toàn bộ các bản phát hành trước đó (\`V_2.1_beta\`, \`V_2.0_beta\`, \`V_1.0\`, \`v2.0.0\`) được giữ nguyên tuyệt đối, không chỉnh sửa hay ghi đè.
          > Quy ước phiên bản xem tại \`VERSIONING.md\` (nâng tính năng/UI tăng số sau: \`2.2 -> 2.3 -> 2.4\`; nâng thuật toán/kiến trúc lõi từ \`2.X\` giữ nguyên nhánh sau: \`2.2 -> 3.2\`, \`2.3 -> 3.3\`).

          ### 7 Trụ cột nâng cấp trong \`${TAG}\`

          1. **Chính sách phát hành Bất biến & Quản lý Phiên bản chuẩn hóa**:
             - Tập trung phiên bản tại \`version.properties\` và quy chuẩn đặt tên tại \`VERSIONING.md\`.
             - CI gắn cổng **IMMUTABLE RELEASE GUARD**: từ chối ghi đè mọi tag/release cũ, mỗi bản mới luôn tạo release riêng độc lập.

          2. **Luật Chặn Request chủ động tại Proxy (Proactive Interception Rules)**:
             - Khai báo trước luật chặn theo **Nhánh / Đường dẫn** và ma trận từng **HTTP Method** (\`GET / POST / PUT / PATCH / DELETE / HEAD / OPTIONS\`) ngay từ trước khi bấm crawl.
             - Hỗ trợ 3 chế độ theo thứ tự ưu tiên: **Chặn & Giả lập 200 OK** (tùy chỉnh status code + JSON body), **Chặn & Hủy (Drop)**, và **Ngoại lệ Cho phép (Allow)** để vượt qua luật chặn tổng quát.
             - Tích hợp Tab **2. Luật Chặn Proxy** trong **Action Workbench** (kèm trình **Kiểm thử khớp trực tiếp — Dry-Run**) và menu chuột phải trực tiếp trên từng nhánh cây.

          3. **Sửa triệt để lỗi dồn chữ & bẹp ô nhập liệu trong Tab Cấu hình**:
             - Cố định độ rộng tối thiểu cho mọi \`JComboBox\` và ô nhập số trong Mục 3, tự động chuyển 1 cột / 2 cột mượt mà không bao giờ bị bẹp 10px hay cắt nhãn chữ.

          4. **Căn cân đối khu vực \`Đích\` + Thanh công cụ Thu gọn / Responsive chia đôi màn hình**:
             - Căn giữa đồng bộ chiều cao \`24px\` cho ô \`Đích\`, chỉ báo \`Đợi: 0\` và đường dẫn nhánh.
             - Thêm nút thu gọn / mở rộng thanh công cụ phía trên (lưu cấu hình lâu dài) hoạt động cho cả toàn màn hình và chế độ chia đôi màn hình: khi cửa sổ hẹp, tự động gom gọn vào dropdown **Điều khiển** & **Thao tác**; bấm mở rộng sẽ xổ hàng drawer tách biệt, không đè chữ.

          5. **Thanh xem Request / Response siêu gọn thu gọn mặc định (\`24px\`)**:
             - Thu gọn mặc định thành 1 dải ngang mảnh \`24px\` tối đa hóa diện tích đọc Request/Response và bảng API; bấm biểu tượng mở rộng để xem đầy đủ chi tiết & nút chức năng.

          6. **Thiết kế lại toàn diện Tab Vai trò (Roles) & Quy tắc (Rules) theo phong cách Tối giản Hiện đại**:
             - Bảo vệ chiều cao hàng thoáng (\`38px\` cho bảng Vai trò, \`32px\` cho bảng Quy tắc) với \`AUTO_RESIZE_OFF\` giúp tiêu đề **"Trạng thái"** và tên vai trò không bao giờ bị cắt cụt.
             - Thiết kế lại thẻ tiêu đề vai trò, thanh thao tác Rules 3 nhóm tinh gọn, badge chế độ sắc nét, và thanh **JWT / Token Inspector** có thể thu gọn.

          7. **Trình quản lý \`{Placeholder}\` & Xác minh khớp trực tiếp cho Excel**:
             - Mở từ nút **\`{...} Placeholder\`** trên tab Excel hoặc chuột phải bất kỳ dòng Excel nào để bấm trực tiếp vào từng đoạn đường dẫn (VD: \`/api/a/9f8e7d6c/c\` -> \`/api/a/{session}/c\`).
             - Hỗ trợ CRUD danh mục \`{placeholder}\` (mặc định + tùy chỉnh Regex) và bảng **Kiểm thử khớp trực tiếp (Live Match Verifier)** trích xuất ngay giá trị từng biến động để yên tâm 100%.

          Tải file \`${JAR}\` rồi nạp vào Burp (\`Extensions > Installed > Add > Java\`).
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG ($VER)"
          git push origin "refs/tags/$TAG"

          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "beta" ] || [ "$CHANNEL" = "alpha" ] || [ "$CHANNEL" = "rc" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" "build/libs/${JAR}" \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
