name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Load version metadata from version.properties
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          get_prop() {
            grep -E "^${1}=" version.properties | head -n 1 | cut -d'=' -f2-
          }
          TAG="$(get_prop releaseTag)"
          VER="$(get_prop versionName)"
          JAR="$(get_prop jarName)"
          CHANNEL="$(get_prop channel)"
          TITLE="$(get_prop releaseTitle)"
          if [ -z "$TAG" ] || [ -z "$JAR" ]; then
            echo "ERROR: version.properties is missing releaseTag or jarName." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Loaded release metadata: tag=$TAG version=$VER channel=$CHANNEL jar=$JAR"

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Stage versioned JAR
        run: cp build/libs/theMythOf-JCrawl.jar "build/libs/${{ steps.ver.outputs.jar }}"

      - uses: actions/upload-artifact@v4
        with:
          name: theMythOf-JCrawl-jar
          path: |
            build/libs/theMythOf-JCrawl.jar
            build/libs/${{ steps.ver.outputs.jar }}

      - name: Publish IMMUTABLE release from version.properties (NEVER modifies existing tags or releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.ver.outputs.jar }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          TITLE: ${{ steps.ver.outputs.title }}
        run: |
          set -euo pipefail

          # STRICT IMMUTABLE RELEASE GUARD:
          # Never force-tag, never --clobber, never edit/overwrite any existing tag or release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Release '$TAG' đã tồn tại — chính sách bất biến KHÔNG cho phép ghi đè release cũ. Bỏ qua bước tạo release."
            echo "Để phát hành bản mới, hãy nâng version trong version.properties (VD: 2.2 -> 2.3 hoặc 2.2 -> 3.2 theo VERSIONING.md)."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Git tag '$TAG' đã tồn tại trên remote — KHÔNG ghi đè tag cũ. Bỏ qua bước tạo release."
            exit 0
          fi

          cat <<EOF > /tmp/release_notes.md
          ## theMythOf-JCrawl \`${TAG}\` (${CHANNEL})

          > Phát hành **bất biến (immutable)** từ commit \`${GITHUB_SHA:0:7}\`. Mọi bản phát hành trước đó được giữ nguyên tuyệt đối, không chỉnh sửa hay ghi đè.
          > Theo \`VERSIONING.md\`: bản thiết kế lại giao diện & kiến trúc hiển thị lên **\`V_7.0_beta\`**. Kế hoạch đầy đủ: \`docs/V7_PLAN.md\`.

          ### Điểm mới trong \`${TAG}\`

          1. **Tab Cây dạng bảng thẳng hàng** (tab mặc định): mọi dòng API / role / chờ duyệt vẽ trên lưới cột cố định \`Nhánh/API | Method | Path | Status | Length | Kết quả Role | Đánh giá\` dù ở nhánh sâu hay nông; header kéo đổi độ rộng; ẩn khung chi tiết / chế độ tối đa.
          2. **Tab API kiểu Burp HTTP History** + cột Kết quả Role dạng ô màu + cột Cách gửi lại; cây bên trái chỉ còn nhánh để lọc.
          3. **Crawl N role không trùng & Ma trận Role**: tự nhận diện role theo token/cookie, API trùng chỉ ghi thêm "Thấy bởi"; Thấy bởi × Gọi được + độ giống body → NGHI BAC; Quyền mong đợi theo nhánh → VI PHẠM; xuất test case Excel/JSON.
          4. **Đẩy sang Logger++** (gửi lại 1 lần, mặc định chỉ GET/HEAD 2xx, header đánh dấu tùy chọn) và **Xuất HAR**.
          5. **Làm việc nhóm an toàn với SOC**: đồng bộ qua thư mục chung (không mở cổng, không gọi mạng), Excel nhóm 6 sheet xuất/gộp; phòng LAN chỉ 127.0.0.1 + passcode bắt buộc.
          6. **Bảo vệ dữ liệu**: mục Action thành 2 câu hỏi + danh sách luật bằng câu tiếng Việt + Thử luật; gộp cấu hình chặn kiểu cũ về một nơi.
          7. **Ẩn/hiện bố cục** (\`Ctrl+Alt+0..3/H\`), tab gọn: Cây · API · Ma trận Role · Báo cáo · Roles · Cần xử lý · Cài đặt.

          Tải file \`${JAR}\` rồi nạp vào Burp (\`Extensions > Installed > Add > Java\`).
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG ($VER)"
          git push origin "refs/tags/$TAG"

          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "beta" ] || [ "$CHANNEL" = "alpha" ] || [ "$CHANNEL" = "rc" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" "build/libs/${JAR}" \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
