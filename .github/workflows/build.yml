name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: theMythOf-JCrawl-jar
          path: build/libs/theMythOf-JCrawl.jar
      - name: Publish the "latest" release (jar ready to load in Burp)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/theMythOf-JCrawl.jar \
            --title "Bản build mới nhất" \
            --notes "Tự động build từ commit ${GITHUB_SHA::7}. Tải theMythOf-JCrawl.jar rồi nạp vào Burp (Extensions > Add > Java)." \
            --prerelease --target "$GITHUB_SHA"
