name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Load version metadata from version.properties
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          get_prop() {
            grep -E "^${1}=" version.properties | head -n 1 | cut -d'=' -f2-
          }
          TAG="$(get_prop releaseTag)"
          VER="$(get_prop versionName)"
          JAR="$(get_prop jarName)"
          CHANNEL="$(get_prop channel)"
          TITLE="$(get_prop releaseTitle)"
          if [ -z "$TAG" ] || [ -z "$JAR" ]; then
            echo "ERROR: version.properties is missing releaseTag or jarName." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Loaded release metadata: tag=$TAG version=$VER channel=$CHANNEL jar=$JAR"

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Stage versioned JAR
        run: cp build/libs/theMythOf-JCrawl.jar "build/libs/${{ steps.ver.outputs.jar }}"

      - uses: actions/upload-artifact@v4
        with:
          name: theMythOf-JCrawl-jar
          path: |
            build/libs/theMythOf-JCrawl.jar
            build/libs/${{ steps.ver.outputs.jar }}

      - name: Publish IMMUTABLE release from version.properties (NEVER modifies existing tags or releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.ver.outputs.jar }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          TITLE: ${{ steps.ver.outputs.title }}
        run: |
          set -euo pipefail

          # STRICT IMMUTABLE RELEASE GUARD:
          # Never force-tag, never --clobber, never edit/overwrite any existing tag or release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Release '$TAG' đã tồn tại — chính sách bất biến KHÔNG cho phép ghi đè release cũ. Bỏ qua bước tạo release."
            echo "Để phát hành bản mới, hãy nâng version trong version.properties (VD: 2.2 -> 2.3 hoặc 2.2 -> 3.2 theo VERSIONING.md)."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Git tag '$TAG' đã tồn tại trên remote — KHÔNG ghi đè tag cũ. Bỏ qua bước tạo release."
            exit 0
          fi

          cat <<EOF > /tmp/release_notes.md
          ## theMythOf-JCrawl \`${TAG}\` (${CHANNEL})

          > Phát hành **bất biến (immutable)** từ commit \`${GITHUB_SHA:0:7}\`. Toàn bộ các bản phát hành trước đó (\`V_3.5_beta\`, \`V_3.4_beta\`, \`V_2.4_beta\`, \`V_2.3_beta\`, \`V_2.2_beta\`, \`V_2.1_beta\`, \`V_2.0_beta\`, \`V_1.0\`, \`v2.0.0\`) được giữ nguyên tuyệt đối, không chỉnh sửa hay ghi đè.
          > Theo quy ước trong \`VERSIONING.md\`: bản cập nhật đồng bộ real-time & điều khiển Method trên Top Bar từ nền \`V_3.5_beta\` tăng MINOR -> **\`V_3.6_beta\`**.

          ### Điểm Nâng cấp Chính trong \`${TAG}\`

          1. **Đồng bộ Real-Time Tức thì trên Cây (\`TreeTab\`), Tab \`API\`, Top Bar & Hàng chờ Proxy**:
             - Đẩy sự kiện trực tiếp lên EDT ngay khi \`ProxyInterceptQueue\` nhận hoặc xử lý request (\`enqueue\` / \`resolve\` / \`releaseAll\`) — **không cần chuyển tab hay di chuyển chỗ khác** mới thấy node \`[CHỜ DUYỆT · CHƯA GỬI]\`.
             - Khi request bị chặn được xử lý (Gửi Server / Lưu nháp / Drop) từ bất kỳ đâu (Cây, Tab API, cửa sổ Hàng chờ chi tiết hoặc hết giờ), mọi khung đang mở tự đồng bộ và dọn dẹp tức thì.
             - Tự động đánh dấu cập nhật Cây (\`TreeTab\`) ngay khi trạng thái API thay đổi (\`dirty\` -> \`200 OK\`) và tự đồng bộ \`Top Bar\` + \`ProxyInterceptDialog\` theo thời gian thực khi \`Sổ cái Luật (CRUD)\` thay đổi.

          2. **Tự động Mở rộng & Cuộn tới Nhánh đang có Request bị Chặn**:
             - Kể cả khi bạn đang thu gọn nhánh đích hoặc cuộn xuống cuối danh sách hàng trăm API, ngay khi có request mới bị chặn vào nhánh đó, Cây tự động mở nhánh (và cụm API trực tiếp) rồi cuộn node \`[CHỜ DUYỆT · CHƯA GỬI]\` vào tầm nhìn mà không làm mất phần bạn đang chỉnh sửa.

          3. **Hiển thị rõ & Bật/Tắt nhanh Method \`GET\` / \`Tất cả\` ngay trên Menu Top Bar**:
             - Menu \`Chặn duyệt\` trên Top Bar hiển thị trực tiếp danh sách Method đang chặn (mặc định \`POST, PUT, PATCH, DELETE\`), kèm nút 1-click: **\`Chặn cả GET (tải trang / API đọc)\`**, **\`Chỉ chặn Action (POST, PUT, PATCH, DELETE)\`** và **\`Chặn TẤT CẢ Method\`**.

          Tải file \`${JAR}\` rồi nạp vào Burp (\`Extensions > Installed > Add > Java\`).
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG ($VER)"
          git push origin "refs/tags/$TAG"

          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "beta" ] || [ "$CHANNEL" = "alpha" ] || [ "$CHANNEL" = "rc" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" "build/libs/${JAR}" \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
