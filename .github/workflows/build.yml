name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Load version metadata from version.properties
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          get_prop() {
            grep -E "^${1}=" version.properties | head -n 1 | cut -d'=' -f2-
          }
          TAG="$(get_prop releaseTag)"
          VER="$(get_prop versionName)"
          JAR="$(get_prop jarName)"
          CHANNEL="$(get_prop channel)"
          TITLE="$(get_prop releaseTitle)"
          if [ -z "$TAG" ] || [ -z "$JAR" ]; then
            echo "ERROR: version.properties is missing releaseTag or jarName." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Loaded release metadata: tag=$TAG version=$VER channel=$CHANNEL jar=$JAR"

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Stage versioned JAR
        run: cp build/libs/theMythOf-JCrawl.jar "build/libs/${{ steps.ver.outputs.jar }}"

      - uses: actions/upload-artifact@v4
        with:
          name: theMythOf-JCrawl-jar
          path: |
            build/libs/theMythOf-JCrawl.jar
            build/libs/${{ steps.ver.outputs.jar }}

      - name: Publish IMMUTABLE release from version.properties (NEVER modifies existing tags or releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.ver.outputs.jar }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          TITLE: ${{ steps.ver.outputs.title }}
        run: |
          set -euo pipefail

          # STRICT IMMUTABLE RELEASE GUARD:
          # Never force-tag, never --clobber, never edit/overwrite any existing tag or release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Release '$TAG' đã tồn tại — chính sách bất biến KHÔNG cho phép ghi đè release cũ. Bỏ qua bước tạo release."
            echo "Để phát hành bản mới, hãy nâng version trong version.properties (VD: 2.2 -> 2.3 hoặc 2.2 -> 3.2 theo VERSIONING.md)."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Git tag '$TAG' đã tồn tại trên remote — KHÔNG ghi đè tag cũ. Bỏ qua bước tạo release."
            exit 0
          fi

          cat <<EOF > /tmp/release_notes.md
          ## theMythOf-JCrawl \`${TAG}\` (${CHANNEL})

          > Phát hành **bất biến (immutable)** từ commit \`${GITHUB_SHA:0:7}\`. Toàn bộ các bản phát hành trước đó (\`V_2.2_beta\`, \`V_2.1_beta\`, \`V_2.0_beta\`, \`V_1.0\`, \`v2.0.0\`) được giữ nguyên tuyệt đối, không chỉnh sửa hay ghi đè.
          > Quy ước phiên bản xem tại \`VERSIONING.md\` (nâng tính năng/UI tăng số sau: \`2.2 -> 2.3 -> 2.4\`; nâng thuật toán/kiến trúc lõi từ \`2.X\` giữ nguyên nhánh sau: \`2.2 -> 3.2\`, \`2.3 -> 3.3\`).

          ### Các nâng cấp & sửa lỗi trọng tâm trong \`${TAG}\`

          1. **Loại bỏ 100% lỗi rò rỉ thẻ \`<html>\` & mã \`&amp;\` / \`&gt;\` trên Burp Suite**:
             - Thay thế hoàn toàn toàn bộ \`JLabel("<html>...")\` bằng thành phần xuống dòng thuần Swing mới \`WrappedText\` (miễn nhiễm với \`UIManager.put("html.disable", true)\` của Burp Suite).
             - Sửa triệt để lỗi thụt lề 200px & khoảng trắng rỗng trong thẻ hướng dẫn \`StructuredAdviceCard\` và 4 thẻ chiến lược ở **Action Workbench**.
             - Bổ sung kiểm thử tự động vĩnh viễn cấm tuyệt đối thẻ \`<html>\` trong toàn bộ mã nguồn UI.

          2. **Thiết kế lại Công tắc \`BẬT | TẮT\` trong Tab Vai trò (Roles)**:
             - Thay thế ô \`[ □ TẮT ]\` lạc quẻ bằng cụm công tắc phân đoạn 2 ô vuông góc tối giản **\`[ BẬT | TẮT ]\`** (\`arc = 0\`, viền hairline \`1px\`, xanh ngọc khi BẬT / xám đá thanh lịch có gạch chân \`2px\` khi TẮT) đồng bộ hoàn hảo với thanh chọn ở khung cấu hình bên phải và không còn bị chói nền khi chọn dòng.
             - Bổ sung bộ biên tập ô tùy chỉnh \`SquareStatusEditor\` bấm 1 chạm mượt mà, loại bỏ hoàn toàn hiện tượng nhấp nháy checkbox mặc định của Swing.

          3. **Cửa sổ Quản lý Bản Trùng & Bản Gốc (#1) dạng Nổi (Floating) — Kéo thả & Mở rộng tùy ý**:
             - Thay thế popup \`JPopupMenu\` bị ghim cứng tại chỗ bằng cửa sổ nổi không khóa thao tác (**modeless**), cho phép **kéo thả di chuyển tự do**, **kéo viền mở rộng/thu gọn tùy ý**, ghi nhớ kích thước yêu thích (\`UiPrefs\`), bấm **\`Ghim\`** để nổi trên cùng, và bấm \`ESC\` để đóng nhanh.
             - Cột \`Vị trí trong cây\` tự động giãn lấp đầy khung khi mở rộng cửa sổ; nới rộng cột \`Trạng thái\` & \`Lần cuối\` để không bao giờ bị cắt chữ \`Chờ bạn chọn\` hay giờ \`07:21:45\`.

          Tải file \`${JAR}\` rồi nạp vào Burp (\`Extensions > Installed > Add > Java\`).
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG ($VER)"
          git push origin "refs/tags/$TAG"

          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "beta" ] || [ "$CHANNEL" = "alpha" ] || [ "$CHANNEL" = "rc" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" "build/libs/${JAR}" \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
