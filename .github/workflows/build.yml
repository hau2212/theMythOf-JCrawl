name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: theMythOf-JCrawl-jar
          path: build/libs/theMythOf-JCrawl.jar
      - name: Publish the "V_1.0" release (jar ready to load in Burp, keeping previous release intact)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/libs/theMythOf-JCrawl.jar build/libs/theMythOf-JCrawl_V_1.0.jar
          NOTES="Bản V_1.0 (tự động build từ commit ${GITHUB_SHA::7}) — Đã tích hợp đầy đủ 4 Phương pháp Bảo vệ & Tái tạo ID sống cho Action API (POST/PUT/PATCH/DELETE), Menu chuột phải chọn đổi ID bất kỳ lúc nào cho từng API, và giao diện tối giản hình chữ nhật/vuông sắc cạnh + Tree-Table. Tải file theMythOf-JCrawl_V_1.0.jar rồi nạp vào Burp (Extensions > Installed > Add > Java). (Bản chưa cập nhật chức năng Action vẫn được giữ nguyên ở bản release bên dưới)."
          git tag -f V_1.0 "$GITHUB_SHA"
          git push -f origin refs/tags/V_1.0
          if gh release view V_1.0 > /dev/null 2>&1; then
            gh release upload V_1.0 build/libs/theMythOf-JCrawl_V_1.0.jar --clobber
            gh release edit V_1.0 --title "theMythOf-JCrawl V_1.0 — Bản cập nhật 4 Phương pháp Action API & Giao diện Vuông/Tree-Table" --notes "$NOTES" --prerelease=false --latest
          else
            gh release create V_1.0 build/libs/theMythOf-JCrawl_V_1.0.jar --title "theMythOf-JCrawl V_1.0 — Bản cập nhật 4 Phương pháp Action API & Giao diện Vuông/Tree-Table" \
              --notes "$NOTES" --latest --target "$GITHUB_SHA"
          fi
