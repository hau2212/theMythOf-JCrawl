name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Load version metadata from version.properties
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          get_prop() {
            grep -E "^${1}=" version.properties | head -n 1 | cut -d'=' -f2-
          }
          TAG="$(get_prop releaseTag)"
          VER="$(get_prop versionName)"
          JAR="$(get_prop jarName)"
          CHANNEL="$(get_prop channel)"
          TITLE="$(get_prop releaseTitle)"
          if [ -z "$TAG" ] || [ -z "$JAR" ]; then
            echo "ERROR: version.properties is missing releaseTag or jarName." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Loaded release metadata: tag=$TAG version=$VER channel=$CHANNEL jar=$JAR"

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Stage versioned JAR
        run: cp build/libs/theMythOf-JCrawl.jar "build/libs/${{ steps.ver.outputs.jar }}"

      - uses: actions/upload-artifact@v4
        with:
          name: theMythOf-JCrawl-jar
          path: |
            build/libs/theMythOf-JCrawl.jar
            build/libs/${{ steps.ver.outputs.jar }}

      - name: Publish IMMUTABLE release from version.properties (NEVER modifies existing tags or releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.ver.outputs.jar }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          TITLE: ${{ steps.ver.outputs.title }}
        run: |
          set -euo pipefail

          # STRICT IMMUTABLE RELEASE GUARD:
          # Never force-tag, never --clobber, never edit/overwrite any existing tag or release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Release '$TAG' đã tồn tại — chính sách bất biến KHÔNG cho phép ghi đè release cũ. Bỏ qua bước tạo release."
            echo "Để phát hành bản mới, hãy nâng version trong version.properties (VD: 2.2 -> 2.3 hoặc 2.2 -> 3.2 theo VERSIONING.md)."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Git tag '$TAG' đã tồn tại trên remote — KHÔNG ghi đè tag cũ. Bỏ qua bước tạo release."
            exit 0
          fi

          cat <<EOF > /tmp/release_notes.md
          ## theMythOf-JCrawl \`${TAG}\` (${CHANNEL})

          > Phát hành **bất biến (immutable)** từ commit \`${GITHUB_SHA:0:7}\`. Toàn bộ các bản phát hành trước đó (\`V_3.4_beta\`, \`V_2.4_beta\`, \`V_2.3_beta\`, \`V_2.2_beta\`, \`V_2.1_beta\`, \`V_2.0_beta\`, \`V_1.0\`, \`v2.0.0\`) được giữ nguyên tuyệt đối, không chỉnh sửa hay ghi đè.
          > Theo quy ước trong \`VERSIONING.md\`: cập nhật nâng cấp UX/UI, điều phối Cây & Action Workbench từ nền \`V_3.4_beta\` tăng MINOR -> **\`V_3.5_beta\`**.

          ### 6 Điểm Nâng cấp Chính trong \`${TAG}\`

          1. **Thanh Header Trên cùng 1 Hàng Chuẩn + Hiển thị & Bật/Tắt Action Ngay Lập Tức**:
             - Sửa triệt để lỗi rớt dòng/chồng nút trên Top Bar; gom cụm điều khiển gọn trong 1 hàng duy nhất.
             - Hiển thị rõ trạng thái Action đang chạy ngay trên Header (\`Action: Nguyên bản\` / \`Chờ duyệt\` / \`Giữ Proxy\` / \`Sổ cái (N luật)\`) kèm công tắc gạt **\`ModernToggleSwitch\`** bật/tắt 1-click và menu chọn nhanh 6 chế độ.

          2. **Thao tác Nhanh Trực tiếp Trên Cây (Tree-First Intercept & Sửa nhanh Raw HTTP)**:
             - Request đang bị giữ tại Proxy xuất hiện **ngay trong Nhánh Đích của Cây** với nhãn \`[CHỜ DUYỆT · CHƯA GỬI]\` và bộ đếm chờ duyệt trên thư mục (mặc định không tự bật popup choán màn hình).
             - Khi chọn node trên cây, chỉnh sửa Raw HTTP trực tiếp ngay trong tab \`Request\` kèm thanh thao tác nhanh: **\`Gửi lên Server\`**, **\`Lưu nháp (Không gửi)\`**, **\`Drop\`**, **\`Format JSON\`**, **\`Lưu sửa\`**, và nút **\`Mở cửa sổ chi tiết\`** chỉ khi cần.

          3. **Cửa sổ Hàng đợi Proxy Chi tiết (\`ProxyInterceptDialog\`) Đồng bộ & Hiển thị Đầy đủ Ngữ cảnh**:
             - Bảng 8 cột mới bổ sung **\`Nhánh đích\`**, **\`Host\`**, **\`Trạng thái\`**, bộ lọc nhanh theo Nhánh / Host / Tìm kiếm, dải chọn Method dạng chip (\`MethodChipBar\`) và công tắc \`ModernToggleSwitch\` đồng bộ giao diện Light/Dark của Burp Suite.

          4. **Thiết kế lại Toàn bộ Giao diện \`RolesTab\` Đồng bộ Hệ thống**:
             - Thay toàn bộ công tắc cũ trong bảng và khung chỉnh sửa bằng **\`ModernToggleSwitch\`** bo tròn sắc nét, chip phân tầng Tier & Rule hiện đại và hệ nút bấm \`Ui.solidPrimary\` / \`Ui.dangerBtn\` / \`Ui.secondaryBtn\` chuẩn tương phản.

          5. **Action Workbench Gọn 5 Tab + Sửa Dứt điểm Lỗi Khó Tìm Nút Lưu (CRUD Form)**:
             - Rút gọn từ 6 tab dàn trải thành **5 tab trực quan**: \`1. Chiến lược & Bật/Tắt\`, \`2. Sổ cái Luật (CRUD)\`, \`3. Bộ Dò & Căn chỉnh\`, \`4. Kho ID · Chuỗi · Khóa 200\` (sub-tabs), \`5. Hướng dẫn & Ví dụ\`.
             - Form CRUD mới hiển thị theo ngữ cảnh (Progressive Disclosure), nút chính đặc màu **\`Lưu chính sách mới (Ctrl+S)\` / \`Lưu thay đổi\`** luôn ghim nổi bật dưới chân form, tự đặt tên khi để trống và báo xác nhận màu xanh sau khi lưu.

          6. **Tích hợp Sổ tay Hướng dẫn Kiến trúc Action & 5 Kịch bản Áp dụng 1-Click**:
             - Sơ đồ kiến trúc 2 tầng (Tầng Proxy trước khi lên Server vs Tầng Replay khi chạy Role), bảng so sánh 6 chế độ và 5 tình huống thực chiến có nút **\`Áp dụng ngay\`** 1 chạm (0% HTML, tương thích hoàn toàn Burp Light & Dark).

          Tải file \`${JAR}\` rồi nạp vào Burp (\`Extensions > Installed > Add > Java\`).
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG ($VER)"
          git push origin "refs/tags/$TAG"

          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "beta" ] || [ "$CHANNEL" = "alpha" ] || [ "$CHANNEL" = "rc" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" "build/libs/${JAR}" \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
