name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Load version metadata from version.properties
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          get_prop() {
            grep -E "^${1}=" version.properties | head -n 1 | cut -d'=' -f2-
          }
          TAG="$(get_prop releaseTag)"
          VER="$(get_prop versionName)"
          JAR="$(get_prop jarName)"
          CHANNEL="$(get_prop channel)"
          TITLE="$(get_prop releaseTitle)"
          if [ -z "$TAG" ] || [ -z "$JAR" ]; then
            echo "ERROR: version.properties is missing releaseTag or jarName." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Loaded release metadata: tag=$TAG version=$VER channel=$CHANNEL jar=$JAR"

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Stage versioned JAR
        run: cp build/libs/theMythOf-JCrawl.jar "build/libs/${{ steps.ver.outputs.jar }}"

      - uses: actions/upload-artifact@v4
        with:
          name: theMythOf-JCrawl-jar
          path: |
            build/libs/theMythOf-JCrawl.jar
            build/libs/${{ steps.ver.outputs.jar }}

      - name: Publish IMMUTABLE release from version.properties (NEVER modifies existing tags or releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.ver.outputs.jar }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          TITLE: ${{ steps.ver.outputs.title }}
        run: |
          set -euo pipefail

          # STRICT IMMUTABLE RELEASE GUARD:
          # Never force-tag, never --clobber, never edit/overwrite any existing tag or release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Release '$TAG' đã tồn tại — chính sách bất biến KHÔNG cho phép ghi đè release cũ. Bỏ qua bước tạo release."
            echo "Để phát hành bản mới, hãy nâng version trong version.properties (VD: 2.2 -> 2.3 hoặc 2.2 -> 3.2 theo VERSIONING.md)."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "IMMUTABLE GUARD: Git tag '$TAG' đã tồn tại trên remote — KHÔNG ghi đè tag cũ. Bỏ qua bước tạo release."
            exit 0
          fi

          cat <<EOF > /tmp/release_notes.md
          ## theMythOf-JCrawl \`${TAG}\` (${CHANNEL})

          > Phát hành **bất biến (immutable)** từ commit \`${GITHUB_SHA:0:7}\`. Toàn bộ các bản phát hành trước đó (\`V_2.3_beta\`, \`V_2.2_beta\`, \`V_2.1_beta\`, \`V_2.0_beta\`, \`V_1.0\`, \`v2.0.0\`) được giữ nguyên tuyệt đối, không chỉnh sửa hay ghi đè.
          > Quy ước phiên bản xem tại \`VERSIONING.md\` (nâng tính năng/UI tăng số sau: \`2.3 -> 2.4\`; nâng thuật toán/kiến trúc lõi từ \`2.X\` giữ nguyên nhánh sau: \`2.4 -> 3.4\`).

          ### Các nâng cấp & sửa lỗi trọng tâm trong \`${TAG}\`

          1. **Chế độ #5 mới — Chặn chờ duyệt trực tiếp tại Proxy (\`INTERCEPT_WAIT\` — Đợi tôi bấm Gửi lên Server)**:
             - Cho phép bật chặn đứng request ngay khi bạn bấm nút trên trình duyệt (VD: **Save / Xóa / Cập nhật...**) theo **mọi phạm vi**:
               - **Toàn bộ** (chọn ma trận HTTP Method: \`POST\`, \`PUT\`, \`PATCH\`, \`DELETE\`, \`GET\`, \`HEAD\`, \`OPTIONS\`),
               - **1 Nhánh / Path bất kỳ** (kèm nhánh con, bật nhanh qua chuột phải hoặc nút \`+ Chặn nhánh hiện tại\`),
               - **1 API đã xuất hiện** (chuột phải API -> \`Chặn chờ duyệt cho API này\`),
               - **Luật Chặn Proxy nâng cao** (wildcard/regex/host với hành động mới \`Chặn chờ duyệt\`).
             - Bổ sung cửa sổ nổi kéo thả & co giãn **Hàng chờ Chặn Proxy trực tiếp** (\`ProxyInterceptDialog\`, hỗ trợ **Ghim nổi**, xem/chỉnh sửa trực tiếp raw HTTP request kèm tự động tính lại \`Content-Length\`) với các nút 1 chạm: **\`Gửi lên Server (Forward)\`**, **\`Lưu vào bảng & Giữ (Không đẩy Server)\`**, **\`Hủy bỏ (Drop)\`**, **\`Gửi tất cả\`**, **\`Hủy tất cả\`**.
             - Nút trạng thái trực tiếp ngay trên thanh tiêu đề chính (hiện số request đang bị chặn màu đỏ nổi bật & tự động bật cửa sổ Hàng chờ khi có request bị chặn).

          2. **Sửa triệt để 5 lỗi gốc khiến Chiến lược #1 ("Giữ ở Proxy") không chặn được khi bấm Save**:
             - Chuyển cổng chặn chính sang \`api.proxy().registerRequestHandler(ProxyRequestHandler)\` — tương thích **100% mọi phiên bản Burp Suite Montoya (2023 -> 2026.7+)**, dùng reflection an toàn cho \`RequestToBeSentAction.spoof()\` để không bao giờ bị lỗi \`NoSuchMethodError\` trên Burp bản cũ (tự rơi về \`ProxyRequestReceivedAction.drop()\` an toàn tuyệt đối).
             - Sửa lỗi chọn Chiến lược #1 ở phạm vi \`Riêng API đang chọn\` không đăng ký vào danh sách giữ ở Proxy.
             - Sửa lỗi \`autoSend = true\` tự động bắn lại request vừa bị giữ lên Server.
             - Sửa lỗi bộ lọc Capture (\`captureEnabled = false\`, \`apiRegex\`, \`targetOnly\`) âm thầm bỏ qua luật chặn chủ động của người dùng.
             - Bỏ qua \`X-JCrawl-Held: true\` trong \`ProxyResponseHandler\` để tránh ghi trùng request đã giữ.

          Tải file \`${JAR}\` rồi nạp vào Burp (\`Extensions > Installed > Add > Java\`).
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG ($VER)"
          git push origin "refs/tags/$TAG"

          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "beta" ] || [ "$CHANNEL" = "alpha" ] || [ "$CHANNEL" = "rc" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" "build/libs/${JAR}" \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
